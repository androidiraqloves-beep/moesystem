
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MoeSystem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#05050a;--txt:#fff;--mut:#bdb6ca;--line:rgba(255,255,255,.12);--card:rgba(255,255,255,.052);--p:#7c3aed;--p2:#a78bfa;--b:#2563eb;--c:#22d3ee}
        *{box-sizing:border-box}
        html,body{margin:0;min-height:100%;font-family:"Noto Kufi Arabic",Tahoma,system-ui,sans-serif;background:#05050a;color:#fff;overflow-x:hidden}
        body{background:radial-gradient(circle at 50% 115%,rgba(124,58,237,.42),transparent 35%),radial-gradient(circle at 0 75%,rgba(34,211,238,.12),transparent 24%),linear-gradient(180deg,#030306,#08070d 62%,#040407)}
        a{text-decoration:none;color:inherit}
        button,input,textarea,select{font:inherit}
        .btn,button{border:0;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;font-weight:900;cursor:pointer;padding:11px 16px}
        .btn.secondary,button.secondary{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
        .danger{background:#991b1b!important}
        .ok{background:#166534!important}
        .mut{color:var(--mut)}
        .hidden{display:none!important}
        .nav{min-height:76px;border-bottom:1px solid var(--line);background:rgba(5,5,10,.92);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
        .navin{width:min(1180px,94%);min-height:76px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
        .brand{display:flex;align-items:center;gap:12px;cursor:pointer}
        .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--p),var(--b));display:grid;place-items:center;font-size:26px;font-weight:900;overflow:hidden}
        .logo img{width:100%;height:100%;object-fit:contain;padding:6px}
        .brand b{font-size:22px;display:block}
        .brand small{display:block;color:#c8c2d2;font-size:12px}
        .links,.langs{display:flex;align-items:center;gap:12px}
        .links button,.langs button{background:transparent;border:0;padding:8px 3px;color:#ddd9e8}
        .links button.active,.links button:hover,.langs button.active{color:var(--p2)}
        .menu{display:none}
        .page{display:none;min-height:calc(100vh - 76px);padding:42px 20px 78px;position:relative}
        .page.active{display:grid;place-items:center}
        .page:before{content:"";position:absolute;left:-115px;bottom:-225px;width:760px;height:350px;border-radius:50% 50% 0 0;background:radial-gradient(circle at center,rgba(124,58,237,.46),rgba(124,58,237,.14) 45%,transparent 70%);border-top:1px solid rgba(167,139,250,.25);pointer-events:none}
        .hero,.card{position:relative;z-index:1;width:min(1000px,100%)}
        .hero{text-align:center}
        .badge{display:inline-flex;border:1px solid rgba(167,139,250,.25);background:rgba(255,255,255,.035);border-radius:999px;padding:8px 15px;color:#ddd6fe;font-weight:900;margin-bottom:22px}
        h1{margin:0 0 17px;font-size:clamp(52px,9vw,108px);line-height:.94;font-weight:900;background:linear-gradient(135deg,#fff,#c4b5fd 35%,#7c3aed 70%,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
        .subtitle{font-size:clamp(21px,3vw,35px);font-weight:900;line-height:1.5;margin-bottom:16px}
        .lead,.desc{color:var(--mut);line-height:2;font-size:18px}
        .lead{max-width:800px;margin:auto}
        .cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:28px}
        .card{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:0 24px 75px rgba(0,0,0,.28)}
        .ptitle{margin:0 0 10px;font-size:clamp(36px,6vw,68px);background:linear-gradient(135deg,#fff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
        .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
        .item{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.11);border-radius:22px;padding:20px}
        .item h3{margin:0 0 8px}
        .item p{margin:0;color:#bbb5c8;line-height:1.85}
        .product{cursor:pointer;display:flex;flex-direction:column;min-height:310px}
        .appLogo{width:92px;height:92px;border-radius:25px;background:linear-gradient(135deg,rgba(124,58,237,.24),rgba(34,211,238,.12));display:grid;place-items:center;overflow:hidden;margin-bottom:12px;border:1px solid rgba(255,255,255,.12)}
        .appLogo img{width:100%;height:100%;object-fit:contain;padding:7px}
        .fallback{width:100%;height:100%;display:grid;place-items:center;font-size:34px;font-weight:900;background:linear-gradient(135deg,var(--p),var(--b))}
        .tag{display:inline-flex;color:#ddd6fe;border:1px solid rgba(167,139,250,.22);background:rgba(124,58,237,.12);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;margin-bottom:12px}
        .miniFeatures{display:grid;gap:7px;margin:12px 0 16px}
        .miniFeature{font-size:13px;color:#e5dcff;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);border-radius:12px;padding:8px 10px;line-height:1.65}
        .priceMini{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:auto;padding-top:12px}
        .pricePill{border:1px solid rgba(34,211,238,.18);background:linear-gradient(135deg,rgba(124,58,237,.16),rgba(34,211,238,.07));border-radius:14px;padding:8px;text-align:center;min-height:60px}
        .pricePill small{display:block;color:#bdb6ca;font-size:11px;font-weight:800;margin-bottom:3px}
        .pricePill b{display:block;color:#fff;font-size:13px;line-height:1.45}
        .detail{width:min(1180px,100%)}
        .detailLayout{display:grid;grid-template-columns:.95fr 1.05fr;gap:22px}
        .detailHead{background:linear-gradient(135deg,rgba(124,58,237,.22),rgba(37,99,235,.10));border:1px solid rgba(167,139,250,.18);border-radius:26px;padding:24px}
        .detailRow{display:flex;align-items:center;gap:14px;margin-bottom:12px}
        .detailLogo{width:86px;height:86px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
        .detailLogo img{width:100%;height:100%;object-fit:contain;padding:7px}
        .detailTitle{font-size:clamp(38px,6vw,64px);margin:0;line-height:1.1;background:linear-gradient(135deg,#fff,#c4b5fd,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
        .featureList{display:grid;gap:10px;margin:18px 0}
        .feature{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);border-radius:16px;padding:13px 15px;color:#eee;font-weight:800;line-height:1.85}
        .feature b{display:block;color:#fff;margin-bottom:2px}
        .boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
        .box{border:1px solid rgba(167,139,250,.18);background:rgba(255,255,255,.04);border-radius:18px;padding:16px}
        .box h3{margin:0 0 8px;color:#ddd6fe}
        .box p{margin:0;color:#c8c2d2;line-height:1.8}
        .priceCards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
        .priceCard{position:relative;overflow:hidden;border:1px solid rgba(34,211,238,.18);background:linear-gradient(135deg,rgba(124,58,237,.20),rgba(37,99,235,.08));border-radius:20px;padding:17px;box-shadow:0 18px 48px rgba(0,0,0,.18)}
        .priceCard:before{content:"";position:absolute;inset:auto -25px -42px auto;width:90px;height:90px;border-radius:50%;background:rgba(34,211,238,.10)}
        .priceCard h3{position:relative;margin:0 0 8px;color:#ddd6fe;font-size:16px}
        .priceCard strong{position:relative;display:block;font-size:24px;color:#fff;margin-bottom:8px;line-height:1.35}
        .priceCard p{position:relative;margin:0;color:#c8c2d2;line-height:1.8;font-size:14px}
        .screens{display:grid;gap:14px}
        .screen{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.11);border-radius:24px;padding:10px;min-height:210px;display:grid;place-items:center;cursor:pointer}
        .screen img{width:100%;height:auto;max-height:540px;object-fit:contain;border-radius:17px;background:#080812}
        .mock{width:100%;height:250px;border-radius:17px;background:linear-gradient(135deg,rgba(124,58,237,.32),rgba(37,99,235,.20));display:grid;place-items:center;text-align:center;font-weight:900;color:#f2efff}
        .faq{display:grid;gap:10px}
        .light{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:99;display:none;align-items:center;justify-content:center;padding:22px}
        .light.active{display:flex}
        .light img{max-width:96vw;max-height:92vh;border-radius:18px}
        .footer{padding:24px;text-align:center;color:#9b93aa;border-top:1px solid var(--line)}
        @media(max-width:850px){.navin{flex-wrap:wrap;padding:10px 0}.menu{display:inline-flex}.links{display:none;order:6;width:100%;flex-direction:column;align-items:stretch;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:18px;padding:10px}.links.open{display:flex}.links button{text-align:inherit;padding:12px}.page{padding:28px 13px 74px}.grid,.detailLayout,.boxes,.priceCards,.priceMini{grid-template-columns:1fr}.card{padding:20px}.btn{width:100%}.cta{align-items:stretch}h1{font-size:58px}.logo{width:48px;height:48px}.brand b{font-size:18px}}
    </style>
</head>
<body>

<nav class="nav">
    <div class="navin">
        <div class="brand" onclick="openPage('home')">
            <span class="logo" id="siteLogo">M</span>
            <div><b id="brandName">MoeSystem</b><small id="brandSub">مو سستم</small></div>
        </div>
        <button class="menu" id="menuBtn">القائمة</button>
        <div class="links" id="navLinks">
            <button class="active" data-page="home" data-k="home">الرئيسية</button>
            <button data-page="services" data-k="services">خدماتنا</button>
            <button data-page="products" data-k="products">منتجاتنا</button>
            <button data-page="about" data-k="about">من نحن</button>
            <button data-page="faq" data-k="faq">الأسئلة</button>
            <button data-page="contact" data-k="contact">تواصل</button>
        </div>
        <div class="langs">
            <button data-lang="ar">AR</button>
            <button data-lang="ku">KU</button>
            <button data-lang="en">EN</button>
        </div>
    </div>
</nav>

<main id="home" class="page active">
    <div class="hero">
        <div class="badge" id="homeBadge"></div>
        <h1 id="homeTitle"></h1>
        <div class="subtitle" id="homeSub"></div>
        <p class="lead" id="homeText"></p>
        <div class="cta">
            <a class="btn" id="heroWhats" target="_blank"></a>
            <button class="btn secondary" data-page="products" data-k="browse"></button>
        </div>
    </div>
</main>

<section id="services" class="page">
    <div class="card">
        <h2 class="ptitle" id="servicesTitle"></h2>
        <p class="desc" id="servicesDesc"></p>
        <div class="grid" id="servicesGrid"></div>
    </div>
</section>

<section id="products" class="page">
    <div class="card">
        <h2 class="ptitle" id="productsTitle"></h2>
        <p class="desc" id="productsDesc"></p>
        <div class="grid" id="productsGrid"></div>
    </div>
</section>

<section id="productDetail" class="page">
    <div class="card detail" id="productDetailBody"></div>
</section>

<section id="about" class="page">
    <div class="card">
        <h2 class="ptitle" id="aboutTitle"></h2>
        <p class="desc" id="aboutText"></p>
        <div class="grid" id="aboutGrid"></div>
    </div>
</section>

<section id="faq" class="page">
    <div class="card">
        <h2 class="ptitle" id="faqTitle"></h2>
        <p class="desc" id="faqDesc"></p>
        <div class="faq" id="faqGrid"></div>
    </div>
</section>

<section id="contact" class="page">
    <div class="card">
        <h2 class="ptitle" id="contactTitle"></h2>
        <p class="desc" id="contactDesc"></p>
        <div class="grid" id="contactGrid"></div>
        <div class="cta" style="justify-content:flex-start">
            <a class="btn" id="contactWhats" target="_blank"></a>
            <a class="btn secondary" id="mailBtn"></a>
        </div>
    </div>
</section>

<footer class="footer">MoeSystem © <span id="year"></span></footer>
<div class="light" id="lightbox" onclick="hideLight()"><img id="lightImg" alt=""></div>

تظهر L، مما يقلل الأخطاء ويسرع عمل المختبر.","طباعة النتائج — يدعم النظام طباعة نتائج التحاليل بورقة احترافية بتصاميم متعددة، مع إمكانية اختيار لون الورقة، شكل الهيدر، شكل الجدول، شكل الفوتر، والقالب الكامل. كما يدعم الطباعة بمقاس A4 مع ترتيب رسمي مناسب للمختبرات.","قوالب طباعة جاهزة — يوفر النظام قوالب طباعة جاهزة تجمع بين الألوان والهيدر والجداول بشكل متناسق، بحيث يستطيع المستخدم اختيار قالب كامل بنقرة واحدة.","معاينة حية للطباعة — توجد معاينة مباشرة لشكل ورقة الطباعة داخل إعدادات الطباعة، تتغير فوراً عند اختيار اللون أو شكل الهيدر أو الجدول، مما يسمح للمستخدم بمشاهدة التصميم قبل الحفظ.","رفع شعار المختبر — يدعم النظام رفع شعار المختبر، ويظهر الشعار في هيدر ورقة الطباعة، كما يمكن استخدامه كعلامة مائية داخل الورقة.","العلامة المائية — يوفر النظام علامة مائية قابلة للتحكم، مع إمكانية تشغيلها أو إيقافها، وتحديد حجمها ودرجة شفافيتها من نافذة مراجعة الطباعة.","الختم الإلكتروني — يدعم النظام إنشاء ختم إلكتروني للمختبر، مع إمكانية اختيار شكل الختم، اللون، النصوص، والرمز الداخلي. كما يمكن إظهار الختم أو إخفاؤه عند الطباعة.","مراجعة قبل الطباعة — قبل طباعة النتيجة، يمكن فتح نافذة مراجعة للنتيجة، تعديل القيم، التحكم بالختم والعلامة المائية، ثم الطباعة أو تحميل PDF.","تحميل PDF — يدعم النظام توليد ملف PDF للنتيجة بشكل مباشر، مع حفظ اسم الملف حسب اسم المريض وتاريخ التحليل.","مشاركة واتساب — يدعم النظام مشاركة النتيجة عبر واتساب، مع تجهيز رسالة منظمة للنتيجة وفتح واتساب لإرسالها للمريض.","الباركود والسيريال — ينشئ النظام رقم سيريال وباركود لكل نتيجة، ويظهر داخل ورقة الطباعة وقسم النتائج، مما يسهل البحث عن النتيجة أو المريض لاحقاً.","قراءة الباركود — يدعم النظام قراءة الباركود من جهاز USB، ويمكن فتح نتيجة المريض أو ملفه مباشرة عند قراءة الباركود.","ساحة العمل — يحتوي النظام على قسم خاص باسم ساحة العمل، يساعد فني المختبر على متابعة الطلب الحالي، عرض التحاليل المطلوبة، فتح طريقة العمل لكل تحليل، واستخدام المؤقتات الخاصة بالتحاليل.","طريقة العمل SOP — لكل تحليل يمكن إضافة طريقة عمل خاصة، تشمل نوع العينة، المواد المطلوبة، خطوات العمل، طريقة قراءة النتيجة، والملاحظات. وتظهر هذه الطريقة داخل ساحة العمل عند اختيار التحليل.","منبهات التحاليل — يدعم النظام منبهات خاصة لكل تحليل داخل ساحة العمل، بحيث يمكن إضافة منبه مستقل لكل تحليل مع اسم التحليل، وقت مخصص، تشغيل، إيقاف، كتم، وحذف.","أصوات التنبيه — يوفر النظام عدة أصوات للتنبيه، مع صوت قوي ومستمر لا يتوقف تلقائياً إلا عند الضغط على إيقاف أو كتم.","إدارة التحاليل — يوفر النظام مكتبة كاملة لإدارة التحاليل، تشمل اسم التحليل، القسم، الوحدة، السعر، والـ Normal Range، مع إمكانية الإضافة والتعديل والحذف.","إدارة الأقسام — يمكن تنظيم التحاليل حسب الأقسام مثل Hematology، Biochemistry، Hormones، Serology، Urine، Stool وغيرها.","إدارة العروض — يوجد قسم خاص لإنشاء وتعديل عروض التحاليل، مع اختيار التحاليل الداخلة ضمن العرض وتحديد سعر خاص للباقة.","إدارة الأطباء — يدعم النظام إضافة الأطباء مع الاسم، الاختصاص، الهاتف، العيادة، العنوان، النسبة، ونوع الحساب، مع ربط كل طلب بالطبيب المحوّل.","حساب أرباح الأطباء — يمكن للنظام حساب أرباح الأطباء حسب النسبة المحددة لكل طبيب، اعتماداً على نتائج المرضى المحولين.","الحسابات اليومية — يعرض النظام الحسابات اليومية، مثل إجمالي الطلبات، المبالغ المدفوعة، المتبقي، الخصومات، المصاريف، وصافي الربح التقريبي.","المصاريف — يوفر النظام قسم لإضافة المصاريف مثل الإيجار، الكهرباء، المواد المختبرية، الرواتب، الصيانة، التعقيم، النقل، والطباعة، مع عرض ملخص حسب نوع المصروف.","الديون والمدفوعات — يدعم النظام تسجيل الدفع الكامل أو الجزئي أو عدم الدفع، مع عرض المبلغ المدفوع والباقي لكل نتيجة.","تسديد لاحق — يمكن تسديد المبالغ المتبقية لاحقاً من قسم النتائج أو الحسابات، مع تحديث الحالة المالية تلقائياً.","إدارة المخزن — يوفر النظام إدارة للمخزون، تشمل المواد، الكمية، الحد الأدنى، تاريخ الانتهاء، والملاحظات.","الخصم التلقائي من المخزن — عند إنشاء طلب جديد، يمكن للنظام خصم المواد المرتبطة بالتحاليل من المخزن تلقائياً، مع تنبيه عند وصول المادة إلى الحد الأدنى.","تنبيهات المخزن — يعرض النظام تنبيهات للمواد القريبة من النفاد أو التي وصلت إلى الحد الأدنى.","إدارة الموظفين — يحتوي النظام على قسم لإدارة الموظفين، يشمل الاسم، الوظيفة، الهاتف، والراتب.","إدارة الشفتات — يدعم النظام بدء وإنهاء الشفتات، مع تسجيل الموظف، نوع الشفت، وقت البداية، وقت النهاية، الصندوق الافتتاحي، وعدد الطلبات خلال الشفت.","حسابات الشفت — عند إنهاء الشفت، يحسب النظام الطلبات، الصافي، المدفوع، والباقي خلال فترة الشفت.","لوحة رئيسية — يحتوي النظام على واجهة رئيسية تعرض ملخصات سريعة عن الطلبات، المرضى، النتائج، الحسابات، التنبيهات، والوصول السريع للأقسام المهمة.","الوضع الداكن والفاتح — يدعم النظام الوضع الداكن والوضع الفاتح، مع تصميم مناسب لكل وضع.","دعم اللغات — يدعم النظام ثلاث لغات: العربية، الإنجليزية، والكردية، مما يجعله مناسباً للاستخدام في المختبرات متعددة اللغات ويسهّل العمل على مختلف المستخدمين.","إعدادات المختبر — يمكن تعديل اسم المختبر بالعربي والإنجليزي، الوصف، العنوان، أرقام الهاتف، البريد الإلكتروني، الموقع، والشعار.","النسخ الاحتياطي — يدعم النظام تصدير نسخة احتياطية كاملة من البيانات بصيغة JSON، واستيراد نسخة احتياطية عند الحاجة.","حماية التفعيل — يدعم النظام شاشة تفعيل برقم الجهاز وكود التفعيل، بحيث لا يفتح النظام إلا بعد التفعيل.","سهولة الاستخدام — تم تصميم النظام ليكون مناسباً للعمل اليومي داخل المختبر، بدون تعقيد، مع أزرار واضحة وأقسام مرتبة.","تقليل الأخطاء — يساعد النظام على تقليل الأخطاء من خلال الحفظ التلقائي، الترتيب الواضح، قراءة الباركود، التنبيه للقيم غير الطبيعية، وربط النتائج بملف المريض.","مناسب للمختبرات الصغيرة والمتوسطة — النظام مناسب للمختبرات التي تحتاج إلى إدارة المرضى، النتائج، الطباعة، الحسابات، الأطباء، المخزن، والموظفين من مكان واحد."],"ku":["بەڕێوەبردنی نەخۆشەکان — تۆمارکردنی نەخۆشی نوێ لەگەڵ ناو، ژمارەی تەلەفۆن، تەمەن، ڕەگەز، پزیشکی ڕەوانەکار و تێبینی؛ هەروەها هەڵبژاردنی نەخۆشی پێشتر تۆمارکراو و پڕکردنەوەی زانیارییەکان بە شێوەی خۆکار، لەگەڵ پەڕگەی تایبەت بۆ هەر نەخۆش.","داواکاری شیکاری نوێ — دروستکردنی داواکاری شیکاری بە خێرایی، هەڵبژاردنی شیکارییەکان لە کتێبخانەی ڕێکخراو بەپێی بەشەکان، گەڕانی خێرا و هەڵبژاردنی چەند شیکارییەک بۆ یەک نەخۆش بەبێ لەدەستدانی هەڵبژاردنەکان.","ئۆفەر و پاکێجەکان — بەشی تایبەت بۆ ئۆفەرە ئامادەکان، دروستکردنی پاکێجی شیکاری بە نرخێکی دیاریکراو، پیشاندانی ئۆفەرەکان لە واجهەی داواکاری و جێبەجێکردنی شیکاری و نرخ بە شێوەی خۆکار.","داخلکردنی ئەنجامەکان — واجهەی تایبەت بۆ داخلکردنی ئەنجامی شیکارییەکان، دەستکاری ئەنجام، یەکە، Normal Range و دۆخ، هەروەها دیاریکردنی H/L و ڕەنگکردنی ئەنجامە نائاساییەکان.","ئاگادارکردنەوەی خۆکاری بەهاکان — خوێندنەوەی Normal Range و بەراوردکردنی ئەنجامی داخلکراو؛ ئەگەر بەرزتر بێت H و ئەگەر نزمتر بێت L دەردەکەوێت بۆ کەمکردنەوەی هەڵەکان.","چاپکردنی ئەنجامەکان — چاپی ئەنجام بە لاپەڕەی پیشەیی و دیزاینە جیاوازەکان، هەڵبژاردنی ڕەنگ، هێدەر، خشتە، فوتر و قاڵبی تەواو بە قەبارەی A4.","قاڵبە چاپییە ئامادەکان — قاڵبە ئامادەکان کە ڕەنگ، هێدەر و خشتەکان بە شێوەی هاوتا ڕێکدەخات، بە یەک کلیک هەڵدەبژێردرێت.","پێشبینینی زیندووی چاپ — پیشاندانی ڕاستەوخۆی شێوازی لاپەڕە لە ڕێکخستنەکانی چاپ، کە دەگۆڕێت کاتێک ڕەنگ یان شێوەی هێدەر و خشتە هەڵدەبژێردرێت.","بارکردنی لۆگۆی تاقیگە — پشتگیری بارکردنی لۆگۆی تاقیگە بۆ هێدەر و بەکارهێنانی وەک ئاوی مارک لە ناو لاپەڕەدا.","ئاوی مارک — ئاوی مارک بە شێوەیەکی قابل بە کۆنترۆڵ، لەکارخستن یان ناچالاککردن، دیاریکردنی قەبارە و شەفافیەت لە پەنجەرەی پێداچوونەوەی چاپ.","مۆری ئەلیکترۆنی — دروستکردنی مۆری ئەلیکترۆنی بۆ تاقیگە، هەڵبژاردنی شێوە، ڕەنگ، دەق و هێمای ناوەکی، لەگەڵ پیشاندان یان شاردنەوە لە چاپدا.","پێداچوونەوە پێش چاپ — پێش چاپکردن دەتوانرێت ئەنجام بکرێتەوە، بەهاکان دەستکاری بکرێن، مۆر و ئاوی مارک کۆنترۆڵ بکرێن، پاشان چاپ یان PDF دابەزێندرێت.","دابەزاندنی PDF — دروستکردنی فایل PDF بە شێوەی ڕاستەوخۆ، لەگەڵ ناونانی فایل بە ناوی نەخۆش و بەرواری شیکاری.","هاوبەشکردن لە واتساپ — ئامادەکردنی نامەی ڕێکخراو و کردنەوەی واتساپ بۆ ناردنی ئەنجام بۆ نەخۆش.","بارکۆد و سریال — دروستکردنی ژمارەی سریال و بارکۆد بۆ هەر ئەنجام، پیشاندانیان لە لاپەڕەی چاپ و بەشی ئەنجامەکان بۆ گەڕانی خێرا.","خوێندنەوەی بارکۆد — پشتگیری خوێنەری USB بارکۆد، و کردنەوەی ئەنجام یان پەڕگەی نەخۆش بە خوێندنەوەی بارکۆد.","شوێنی کار — بەشێکی تایبەت بۆ فنی تاقیگە بۆ بەدواداچوونی داواکاری ئێستا، پیشاندانی شیکارییە داواکراوەکان، SOP و تایمەرەکان.","ڕێنمای کاری SOP — بۆ هەر شیکاری دەتوانرێت ڕێنمای کار زیاد بکرێت: جۆری نمونە، مادە پێویستەکان، هەنگاوەکانی کار، خوێندنەوەی ئەنجام و تێبینی.","ئاگادارکەرەوەکانی شیکاری — زیادکردنی ئاگادارکەرەوەی سەربەخۆ بۆ هەر شیکاری لە شوێنی کار، لەگەڵ ناو، کات، دەستپێکردن، ڕاگرتن، بێدەنگکردن و سڕینەوە.","دەنگەکانی ئاگادارکردنەوە — چەند دەنگێک بۆ ئاگادارکردنەوە، لەگەڵ دەنگی بەهێز و بەردەوام کە تەنها بە ڕاگرتن یان بێدەنگکردن کۆتایی دێت.","بەڕێوەبردنی شیکارییەکان — کتێبخانەی تەواو بۆ ناوی شیکاری، بەش، یەکە، نرخ و Normal Range لەگەڵ زیادکردن، دەستکاری و سڕینەوە.","بەڕێوەبردنی بەشەکان — ڕێکخستنی شیکارییەکان بەپێی بەشەکان وەک Hematology، Biochemistry، Hormones، Serology، Urine، Stool و هیتر.","بەڕێوەبردنی ئۆفەرەکان — بەشی تایبەت بۆ دروستکردن و دەستکاری ئۆفەرەکان، هەڵبژاردنی شیکارییەکانی ناو پاکێج و دانانی نرخێکی تایبەت.","بەڕێوەبردنی پزیشکەکان — زیادکردنی پزیشک لەگەڵ ناو، پسپۆڕی، ژمارە، کلینیک، ناونیشان، ڕێژە و جۆری حساب، لەگەڵ پەیوەستکردنی داواکاری بە پزیشک.","حسابکردنی قازانجی پزیشک — حسابکردنی قازانجی پزیشکەکان بەپێی ڕێژەی دیاریکراو بۆ هەر پزیشک و ئەنجامی نەخۆشە ڕەوانەکراوەکان.","حساباتی ڕۆژانە — پیشاندانی کۆی داواکاری، پارەی دراو، ماوە، داشکاندن، خەرجی و قازانجی نزیکەیی.","خەرجییەکان — زیادکردنی خەرجی وەک کرێ، کارەبا، ماددەی تاقیگە، مووچە، چاکسازی، پاککردنەوە، گواستنەوە و چاپ، لەگەڵ پوختە بەپێی جۆر.","قەرز و پارەدان — تۆمارکردنی پارەدانی تەواو، بەشێکی یان نەدراو، لەگەڵ پیشاندانی پارەی دراو و ماوە بۆ هەر ئەنجام.","پارەدانی دواتر — پارەی ماوە دەتوانرێت دواتر لە بەشی ئەنجامەکان یان حسابات بدرێت و دۆخی دارایی خۆکار نوێ دەبێتەوە.","بەڕێوەبردنی کۆگا — بەڕێوەبردنی ماددەکان، بڕ، سنووری کەمترین، بەرواری بەسەرچوون و تێبینی.","کەمکردنەوەی خۆکار لە کۆگا — کاتێک داواکاری نوێ دروست دەکرێت، ماددەی پەیوەندیدار بە شیکارییەکان خۆکار لە کۆگا کەم دەکرێتەوە و ئاگادارکردنەوە دەردەکەوێت.","ئاگادارکردنەوەی کۆگا — پیشاندانی ماددە نزیکبووەکان لە تەواوبوون یان گەیشتوو بە سنووری کەمترین.","بەڕێوەبردنی کارمەندان — بەشی کارمەندان لەگەڵ ناو، پۆست، ژمارەی تەلەفۆن و مووچە.","بەڕێوەبردنی شیفتەکان — دەستپێکردن و کۆتاییهێنانی شیفت، تۆمارکردنی کارمەند، جۆری شیفت، کاتی دەستپێک، کۆتایی، سندووقی سەرەتایی و ژمارەی داواکاری.","حساباتی شیفت — کاتێک شیفت کۆتایی دێت، سیستەم داواکاری، صافی، پارەی دراو و ماوە لە ماوەی شیفت حساب دەکات.","داشبۆردی سەرەکی — واجهەی سەرەکی کە پوختەی داواکاری، نەخۆش، ئەنجام، حسابات، ئاگادارکردنەوە و دەستگەیشتنی خێرا پیشان دەدات.","دۆخی تاریک و ڕووناک — پشتگیری دۆخی تاریک و ڕووناک لەگەڵ دیزاینێکی گونجاو بۆ هەر دۆخ.","پشتگیری زمانەکان — پشتگیری سێ زمان: عەرەبی، ئینگلیزی و کوردی بۆ تاقیگەی چەندزمانە و ئاسانکردنی کار.","ڕێکخستنی تاقیگە — دەستکاری ناوی تاقیگە بە عەرەبی و ئینگلیزی، وەسف، ناونیشان، ژمارەکان، ئیمەیڵ، شوێن و لۆگۆ.","کۆپی پاشەکەوت — دەرکردنی کۆپی پاشەکەوتی تەواوی داتا بە JSON و هاوردەکردنی کۆپی کاتێک پێویست بێت.","پاراستنی چالاککردن — شاشەی چالاککردن بە ژمارەی ئامێر و کۆدی چالاککردن، بەجۆرێک سیستەم تەنها دوای چالاککردن دەکرێتەوە.","ئاسانی بەکارهێنان — دیزاین کراوە بۆ کاری ڕۆژانەی تاقیگە بەبێ ئاڵۆزی، لەگەڵ دوگمەی ڕوون و بەشە ڕێکخراوەکان.","کەمکردنەوەی هەڵەکان — یارمەتی کەمکردنەوەی هەڵەکان دەدات بە پاشەکەوتی خۆکار، ڕێکخستن، بارکۆد، ئاگادارکردنەوەی بەهای نائاسایی و پەیوەستکردنی ئەنجام بە پەڕگەی نەخۆش.","گونجاو بۆ تاقیگەی بچووک و مامناوەند — گونجاوە بۆ تاقیگەکان کە پێویستیان بە بەڕێوەبردنی نەخۆش، ئەنجام، چاپ، حسابات، پزیشک، کۆگا و کارمەندان لە یەک شوێن هەیە."],"en":["Patient management — Register new patients with name, phone, age, gender, referring doctor and notes, or select an existing patient and auto-fill their information, with a dedicated file for previous results and visits.","New test request — Create a new lab request quickly, choose tests from organized categories, search inside tests, and select multiple tests for one patient without losing selections.","Packages and offers — Create ready-made test bundles with a special price and show them as quick slides in the request screen with automatic test and price application.","Result entry — Dedicated screen for entering results, editing value, unit, normal range and status, with H/L flags and clear color highlighting for abnormal values.","Automatic value alerts — Reads the normal range and compares the entered result; it shows H for high and L for low to reduce mistakes and speed up work.","Result printing — Professional printed reports with multiple designs, paper colors, header styles, table styles, footer styles and full templates on A4.","Ready print templates — Complete ready templates that combine colors, headers and tables consistently and can be selected in one click.","Live print preview — Direct preview of the report design inside print settings, updating immediately when color, header or table style changes.","Lab logo upload — Upload the laboratory logo and show it in the print header or use it as a watermark inside the report.","Watermark control — Enable or disable the watermark and control its size and transparency from the print review window.","Electronic stamp — Create a lab electronic stamp, choose its style, color, texts and internal symbol, and show or hide it when printing.","Review before print — Open a review window before printing, edit values, control stamp and watermark, then print or download PDF.","PDF download — Generate a result PDF directly and name the file by patient name and test date.","WhatsApp sharing — Prepare an organized result message and open WhatsApp to send the result to the patient.","Barcode and serial — Generate a serial number and barcode for each result, shown on the report and result section for quick lookup.","Barcode reading — Supports USB barcode scanners to open the patient result or file directly after scanning.","Work area — Dedicated workspace for lab technicians to follow current requests, view requested tests, open SOPs and use timers.","SOP workflow — Add a work procedure for each test including sample type, required materials, steps, result reading method and notes.","Test timers — Add independent timers for each test with test name, custom time, start, stop, mute and delete controls.","Alert sounds — Multiple alert sounds including a strong continuous sound that stops only by stop or mute.","Test management — Full test library with test name, category, unit, price and normal range, with add, edit and delete.","Category management — Organize tests by sections such as Hematology, Biochemistry, Hormones, Serology, Urine and Stool.","Offer management — Create and edit test offers by selecting included tests and setting a special package price.","Doctor management — Add doctors with name, specialty, phone, clinic, address, percentage and account type, and connect each request to the referring doctor.","Doctor profit calculation — Calculate doctor profits based on each doctor percentage and referred patient results.","Daily accounts — Shows total requests, paid amounts, remaining balances, discounts, expenses and approximate net profit.","Expenses — Add expenses such as rent, electricity, lab materials, salaries, maintenance, sterilization, transport and printing, with summaries by type.","Debts and payments — Record full, partial or unpaid status and show paid and remaining amount for every result.","Later payment — Settle remaining amounts later from results or accounts with automatic financial status update.","Inventory management — Manage materials, quantity, minimum limit, expiration date and notes.","Automatic inventory deduction — When creating a new request, linked materials can be deducted automatically from inventory with low-stock alerts.","Inventory alerts — Shows alerts for materials that are near shortage or reached the minimum limit.","Employee management — Manage employees with name, job, phone and salary.","Shift management — Start and end shifts with employee, shift type, start/end time, opening cash and number of requests during the shift.","Shift accounting — At shift closing, the system calculates requests, net amount, paid and remaining amounts during that shift.","Main dashboard — Shows quick summaries for requests, patients, results, accounts, alerts and shortcuts to important sections.","Dark and light mode — Supports both dark and light modes with suitable design for each.","Language support — };

function t(k){ return L[lang]?.[k] || L.ar[k] || k; }

function esc(v){
    return String(v ?? '').replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[s]));
}

function ml(v){
    if(v && typeof v === 'object' && !Array.isArray(v)) return v[lang] || v.ar || v.ku || v.en || '';
    return v || '';
}

function arr(v){
    if(Array.isArray(v)) return v;
    if(v && typeof v === 'object') return v[lang] || v.ar || v.en || v.ku || [];
    return String(v || '').split(/\n+/).filter(Boolean);
}

function wa(text = ''){
    let n = '07761710745';
    n = n.startsWith('0') ? '964' + n.slice(1) : n;
    return 'https://wa.me/' + n + '?text=' + encodeURIComponent(text);
}

function msg(p, type){
    return type === 'trial' ? `مرحبا، أريد نسخة تجريبية من تطبيق: ${ml(p.title)}` : `مرحبا، أريد طلب التطبيق الكامل: ${ml(p.title)}`;
}

function getPricing(p, k){
    let pr = p.pricing?.[k] || {};
    return { price: pr.price || '', details: ml(pr.details) || '' };
}

function priceLabel(k){
    return k === 'online' ? t('onlinePrice') : k === 'offline' ? t('offlinePrice') : t('mobilePrice');
}

function priceMiniHtml(p){
    return ['online', 'offline', 'mobile'].map(k => {
        let pr = getPricing(p, k);
        return `<div class="pricePill"><small>${priceLabel(k)}</small><b>${esc(pr.price || t('noPrice'))}</b></div>`;
    }).join('');
}

function priceCardsHtml(p){
    return `<div class="priceCards">${['online', 'offline', 'mobile'].map(k => {
        let pr = getPricing(p, k);
        return `<div class="priceCard"><h3>${priceLabel(k)}</h3><strong>${esc(pr.price || t('noPrice'))}</strong><p>${esc(pr.details || t('priceDetails'))}</p></div>`;
    }).join('')}</div>`;
}

async function readImage(id){
    if(!id) return '';
    if(cache[id]) return cache[id];
    try {
        let s = await getDoc(doc(db, 'site_images', id));
        let d = s.exists() ? s.data().dataUrl || '' : '';
        cache[id] = d;
        return d;
    } catch(e) {
        console.warn('image read failed', id, e);
        return '';
    }
}

async function srcFrom(id, url, inline){
    return inline || url || await readImage(id);
}

async function loadData(){
    try {
        let s = await getDoc(doc(db, 'site', 'main'));
        if(s.exists()) DATA = { ...DEFAULT_DATA, ...s.data() };
    } catch(e) {
        console.warn('site/main read failed', e);
    }
    renderAll();
}

async function renderAll(){
    document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
    document.documentElement.lang = lang;
    
    document.querySelectorAll('[data-k]').forEach(e => e.textContent = t(e.dataset.k));
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    
    brandName.textContent = ml(DATA.brand) || 'MoeSystem';
    brandSub.textContent = ml(DATA.brandAr) || '';
    
    let sl = await srcFrom(DATA.siteLogoImageId, DATA.siteLogoUrl, DATA.siteLogo);
    siteLogo.innerHTML = sl ? `<img src="${esc(sl)}" alt="logo">` : 'M';
    
    homeBadge.textContent = ml(DATA.home?.badge);
    homeTitle.textContent = ml(DATA.home?.title);
    homeSub.textContent = ml(DATA.home?.subtitle);
    homeText.textContent = ml(DATA.home?.text);
    
    heroWhats.textContent = t('whatsapp');
    heroWhats.href = wa('مرحبا، أريد الاستفسار عن خدمات MoeSystem');
    
    contactWhats.textContent = t('whatsapp');
    contactWhats.href = wa('مرحبا، أريد التواصل مع MoeSystem');
    
    document.querySelector('[data-k="browse"]').textContent = t('browse');
    
    servicesTitle.textContent = ml(DATA.servicesTitle);
    servicesDesc.textContent = ml(DATA.servicesDesc);
    servicesGrid.innerHTML = (DATA.services || []).map(x => `<div class="item"><h3>${esc(ml(x.title))}</h3><p>${esc(ml(x.text))}</p></div>`).join('');
    
    productsTitle.textContent = ml(DATA.productsTitle);
    productsDesc.textContent = ml(DATA.productsDesc);
    await renderProducts();
    
    aboutTitle.textContent = ml(DATA.aboutTitle);
    aboutText.textContent = ml(DATA.aboutText);
    aboutGrid.innerHTML = (DATA.aboutItems || []).map(x => `<div class="item"><h3>${esc(ml(x.title))}</h3><p>${esc(ml(x.text))}</p></div>`).join('');
    
    faqTitle.textContent = ml(DATA.faqTitle);
    faqDesc.textContent = ml(DATA.faqDesc);
    faqGrid.innerHTML = (DATA.faq || []).map(x => `<div class="item"><h3>${esc(ml(x.question || x.q))}</h3><p>${esc(ml(x.answer || x.a))}</p></div>`).join('');
    
    contactTitle.textContent = ml(DATA.contactTitle);
    contactDesc.textContent = ml(DATA.contactDesc);
    contactGrid.innerHTML = `<div class="item"><h3>${t('phone')}</h3><p>07761710745</p></div><div class="item"><h3>${t('email')}</h3><p>${esc(DATA.email || '')}</p></div><div class="item"><h3>${t('company')}</h3><p>${esc(ml(DATA.brand))}</p></div>`;
    
    mailBtn.textContent = t('email');
    mailBtn.href = 'mailto:' + (DATA.email || '');
    
    year.textContent = new Date().getFullYear();
}

function getProductId(p){
    return p.id || String(ml(p.title)).toLowerCase().replace(/\s+/g, '-');
}

function features(p){
    return arr(p.features);
}

function fTitle(x){
    if(typeof x === 'object') return ml(x.title);
    let s = String(x);
    return s.includes('—') ? s.split('—')[0].trim() : '';
}

function fText(x){
    if(typeof x === 'object') return ml(x.text) || ml(x.title);
    return String(x || '');
}

async function renderProducts(){
    let out = '';
    for(const p of (DATA.products || [])){
        let logo = await srcFrom(p.logoImageId, p.logoUrl, p.logo);
        let fs = features(p).slice(0, 5).map(x => `<div class="miniFeature">${esc(fText(x))}</div>`).join('');
        out += `<div class="item product" data-product="${esc(getProductId(p))}"><div class="appLogo">${logo ? `<img src="${esc(logo)}">` : `<span class="fallback">${esc((ml(p.title) || 'A')[0])}</span>`}</div><span class="tag">${esc(ml(p.subtitle) || ml(p.status) || '')}</span><h3>${esc(ml(p.title))}</h3><p>${esc(ml(p.text))}</p><div class="miniFeatures">${fs}</div><div class="priceMini">${priceMiniHtml(p)}</div><button class="btn secondary">${t('browse')}</button></div>`;
    }
    productsGrid.innerHTML = out;
    document.querySelectorAll('[data-product]').forEach(c => c.onclick = () => openProduct(c.dataset.product));
}

function findProduct(id){
    return (DATA.products || []).find(p => getProductId(p) == id);
}

async function openProduct(id){
    let p = findProduct(id);
    if(!p) return;
    
    let logo = await srcFrom(p.logoImageId, p.logoUrl, p.logo);
    let screens = [];
    for(const iid of (p.imageIds || [])){
        let s = await readImage(iid);
        if(s) screens.push(s);
    }
    screens.push(...(p.imageUrls || []).filter(Boolean), ...(p.images || []).filter(Boolean));
    
    let screenHtml = screens.length ? screens.map(s => `<div class="screen" onclick="showLight('${esc(s)}')"><img src="${esc(s)}"></div>`).join('') : `<div class="screen"><div class="mock">${t('noImages')}</div></div>`;
    
    let fs = features(p);
    let fhtml = fs.map((x, i) => `<div class="feature extraF" style="${i > 4 ? 'display:none' : ''}">${fTitle(x) ? '<b>' + esc(fTitle(x)) + '</b>' : ''}${esc(fText(x).replace(fTitle(x) + ' —', '').trim())}</div>`).join('');
    
    productDetailBody.innerHTML = `<button class="btn secondary" onclick="openPage('products')" style="margin-bottom:18px;width:auto">${t('back')}</button><div class="detailLayout"><div class="screens">${screenHtml}</div><div><div class="detailHead"><div class="detailRow"><div class="detailLogo">${logo ? `<img src="${esc(logo)}">` : `<span class="fallback">${esc((ml(p.title) || 'A')[0])}</span>`}</div><div><span class="tag">${esc(ml(p.subtitle) || ml(p.status) || '')}</span><h2 class="detailTitle">${esc(ml(p.title))}</h2></div></div><p class="desc">${esc(ml(p.text))}</p>${priceCardsHtml(p)}<div class="featureList">${fhtml}</div>${fs.length > 5 ? `<button class="btn secondary" id="moreBtn">${t('more')}</button>` : ''}<div class="boxes"><div class="box"><h3>${t('mobile')}</h3><p>${esc(ml(p.mobile || p.mobileDetails))}</p></div><div class="box"><h3>${t('online')}</h3><p>${esc(ml(p.online || p.onlineDetails))}</p></div><div class="box"><h3>${t('offline')}</h3><p>${esc(ml(p.offline || p.offlineDetails))}</p></div></div><div class="cta" style="justify-content:flex-start"><a class="btn" target="_blank" href="${wa(msg(p, 'order'))}">${t('order')}</a><a class="btn secondary" target="_blank" href="${wa(msg(p, 'trial'))}">${t('trial')}</a></div></div></div></div>`;
    
    let mb = document.getElementById('moreBtn');
    if(mb){
        mb.onclick = () => {
            let hidden = [...document.querySelectorAll('.extraF')].some((e, i) => i > 4 && e.style.display === 'none');
            document.querySelectorAll('.extraF').forEach((e, i) => { if(i > 4) e.style.display = hidden ? 'block' : 'none'; });
            mb.textContent = hidden ? t('less') : t('more');
        };
    }
    openPage('productDetail');
}

window.openPage = function(id){
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id)?.classList.add('active');
    document.querySelectorAll('[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === id));
    navLinks.classList.remove('open');
    scrollTo({ top: 0, behavior: 'smooth' });
};

window.showLight = s => { lightImg.src = s; lightbox.classList.add('active'); };
window.hideLight = () => lightbox.classList.remove('active');

document.querySelectorAll('[data-page]').forEach(b => b.onclick = () => openPage(b.dataset.page));
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
    lang = b.dataset.lang;
    localStorage.setItem('moe_lang', lang);
    renderAll();
});

menuBtn.onclick = () => navLinks.classList.toggle('open');
loadData();
</script>
